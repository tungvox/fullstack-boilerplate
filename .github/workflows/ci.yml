name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.signature_placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.signature_placeholder
      STRIPE_SECRET_KEY: sk_test_01234567890123456789012345678901
      STRIPE_WEBHOOK_SECRET: whsec_01234567890123456789012345678901
      STRIPE_PRICE_ID: price_0123456789012345678901234
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_01234567890123456789012345678901
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: true
